<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo arredondado -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="url(#grad)"/>
  
  <!-- QR Code simplificado -->
  <g fill="white">
    <!-- Canto superior esquerdo -->
    <rect x="20" y="20" width="20" height="20" rx="3"/>
    <rect x="24" y="24" width="12" height="12" rx="2" fill="#3b82f6"/>
    
    <!-- Canto superior direito -->
    <rect x="60" y="20" width="20" height="20" rx="3"/>
    <rect x="64" y="24" width="12" height="12" rx="2" fill="#3b82f6"/>
    
    <!-- Canto inferior esquerdo -->
    <rect x="20" y="60" width="20" height="20" rx="3"/>
    <rect x="24" y="64" width="12" height="12" rx="2" fill="#3b82f6"/>
    
    <!-- Padrão QR -->
    <rect x="50" y="35" width="8" height="8" rx="1.5"/>
    <rect x="65" y="50" width="8" height="8" rx="1.5"/>
    <rect x="50" y="65" width="8" height="8" rx="1.5"/>
    <rect x="35" y="50" width="8" height="8" rx="1.5"/>
    <rect x="55" y="55" width="6" height="6" rx="1"/>
  </g>
</svg>
